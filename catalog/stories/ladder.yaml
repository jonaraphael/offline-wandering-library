# Story ladder: one book for each age from 1 to 18.
#
# Each book is a cultural touchstone: knowing it connects a child to other
# children, to older generations, to other cultures, or to the next level of
# reading. Every book is public domain in the United States (first published
# before 1931) and is rendered from a Project Gutenberg transcription into a
# PDF that opens on any phone or computer.
#
# To change a book, edit its entry and run
#   python scripts/build_story_ladder.py --work /tmp/owl-stories
# then follow the steps the script prints.
#
# Fields
#   gutenberg  Project Gutenberg eBook number of the edition to render.
#   slug       File-name words; the PDF is age-NN-<slug>.pdf.
#   byline     Credit line printed under the title.
#   published  Year of first publication (and of this edition, if later).
#   layout     picture: large type and full-width pictures (ages 1-5)
#              early:   large type for reading aloud or a first novel
#              novel:   book type for independent readers
#   breaks     CSS selector for elements that start a new page.
#   why        One sentence printed on the title page for parents and children.

books:
- age: 1
  gutenberg: 10607
  slug: the-real-mother-goose
  title: The Real Mother Goose
  byline: Pictures by Blanche Fisher Wright
  published: '1916'
  layout: picture
  breaks: h2, h3, h4
  why: Rhymes that grandparents still know by heart. Saying them together trains
    the ear for reading.
- age: 2
  gutenberg: 14838
  slug: the-tale-of-peter-rabbit
  title: The Tale of Peter Rabbit
  byline: By Beatrix Potter
  published: '1902'
  layout: picture
  breaks: .fig + p
  why: A first story with a real plot, a warning, a chase and a safe return home.
- age: 3
  gutenberg: 15661
  slug: the-golden-goose-book
  title: The Golden Goose Book
  byline: Pictures by L. Leslie Brooke
  published: '1905'
  layout: picture
  breaks: h2:has(> a[id])
  why: The Three Bears, the Three Little Pigs and Tom Thumb, the tales every older
    child and adult already knows.
- age: 4
  gutenberg: 19994
  slug: the-aesop-for-children
  title: The Aesop for Children
  byline: Pictures by Milo Winter
  published: '1919'
  layout: picture
  breaks: h2:has(> a[id])
  why: Short fables whose lessons live on as sayings in many languages, from sour
    grapes to crying wolf.
- age: 5
  gutenberg: 67098
  slug: winnie-the-pooh
  title: Winnie-the-Pooh
  byline: By A. A. Milne, decorations by Ernest H. Shepard
  published: '1926'
  layout: early
  breaks: h2
  why: The first long book to share a chapter at a time, read aloud for a hundred
    years.
- age: 6
  gutenberg: 503
  slug: the-blue-fairy-book
  title: The Blue Fairy Book
  byline: Edited by Andrew Lang
  published: '1889'
  layout: novel
  breaks: h2
  why: Cinderella, Sleeping Beauty, Hansel and Gretel and Beauty and the Beast, the
    shared fairy tales of Europe in one book.
- age: 7
  gutenberg: 43936
  slug: the-wonderful-wizard-of-oz
  title: The Wonderful Wizard of Oz
  byline: By L. Frank Baum, pictures by W. W. Denslow
  published: '1900'
  layout: early
  breaks: h2
  why: The usual first novel a child reads alone, known to every generation since
    1900.
- age: 8
  gutenberg: 128
  slug: the-arabian-nights
  title: The Arabian Nights
  byline: Selected and edited by Andrew Lang
  published: '1898'
  layout: novel
  breaks: h3
  why: Aladdin, Ali Baba and Sinbad, stories told from Morocco to India for a thousand
    years.
- age: 9
  gutenberg: 28885
  slug: alices-adventures-in-wonderland
  title: Alice's Adventures in Wonderland
  byline: By Lewis Carroll, pictures by Arthur Rackham
  published: 1865; this edition 1907
  layout: novel
  breaks: div.chapter
  why: Nonsense, wordplay and logic puzzles that writers and scientists still quote.
- age: 10
  gutenberg: 32242
  slug: a-wonder-book
  title: A Wonder Book for Girls and Boys
  byline: By Nathaniel Hawthorne, pictures by Walter Crane
  published: 1851; this edition 1892
  layout: novel
  breaks: h2, h3
  why: Greek myths retold for children, Midas, Pandora, Perseus and Hercules, the
    root of countless sayings.
- age: 11
  gutenberg: 45
  slug: anne-of-green-gables
  title: Anne of Green Gables
  byline: By L. M. Montgomery
  published: '1908'
  layout: novel
  breaks: div.chapter
  why: A girl who talks too much finds friendship, school and a home.
- age: 12
  gutenberg: 27780
  slug: treasure-island
  title: Treasure Island
  byline: By Robert Louis Stevenson, pictures by Milo Winter
  published: 1883; this edition 1911
  layout: novel
  breaks: h2
  why: The pirate adventure that every later pirate story borrows from.
- age: 13
  gutenberg: 1661
  slug: the-adventures-of-sherlock-holmes
  title: The Adventures of Sherlock Holmes
  byline: By Arthur Conan Doyle
  published: '1892'
  layout: novel
  breaks: div.chapter
  why: Solving mysteries by reasoning from evidence, with a detective known around
    the world.
- age: 14
  gutenberg: 1513
  slug: romeo-and-juliet
  title: Romeo and Juliet
  byline: By William Shakespeare
  published: about 1597
  layout: novel
  breaks: div.chapter
  why: The play most students read first, and the source of lines quoted everywhere.
- age: 15
  gutenberg: 23
  slug: narrative-of-the-life-of-frederick-douglass
  title: Narrative of the Life of Frederick Douglass, an American Slave
  byline: Written by himself
  published: '1845'
  layout: novel
  breaks: div.chapter
  why: A man who escaped slavery tells how learning to read set him on the road to
    freedom.
- age: 16
  gutenberg: 84
  slug: frankenstein
  title: Frankenstein
  byline: By Mary Wollstonecraft Shelley
  published: '1818'
  layout: novel
  breaks: div.chapter
  why: The first science-fiction novel, asking what a maker owes what it makes.
- age: 17
  gutenberg: 42671
  slug: pride-and-prejudice
  title: Pride and Prejudice
  byline: By Jane Austen
  published: '1813'
  layout: novel
  breaks: h2
  why: Irony, pride and first impressions in a courtship comedy readers still argue
    about.
- age: 18
  gutenberg: 1727
  slug: the-odyssey
  title: The Odyssey
  byline: By Homer, translated by Samuel Butler
  published: translation 1900
  layout: novel
  breaks: div.chapter
  why: A long voyage home, the root story of Western literature.


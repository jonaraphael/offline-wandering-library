schema_version: 1
reviewed_on: '2026-09-28'
profile: full-1tb
purpose: Practical household and community knowledge for prolonged loss of internet and limited electricity.
completion_rule: Adequate means the stated learning and practical tasks are supported by reviewed, usable resources with their prerequisites, illustrations, limits and offline access. Tags, file counts, downloads and GB totals establish neither depth nor adequacy.
maintenance_rule: Update the affected rows in the same change as each resource admission. Keep gaps and next selections explicit; only an editorial review with recorded evidence may mark a row adequate. Regenerate the documentation with scripts/build_content_docs.py.
next_batch:
- 'Initial literacy: evaluate one complete Core Knowledge kindergarten skills sequence, including teacher guidance, readers, exercises and assessments; then plan the remaining progression.'
- 'Seed independence: processing and quality modules are now selected. Next seek a finished crop-specific seed-saving guide covering isolation, pollination and harvest; the current Organic Seed Alliance edition remains a lead. Defer the FAO enterprise/business volume.'
- 'Water systems: rainwater, Afridev and groundwater maintenance manuals are now selected. Next check the source-to-use task sequence, cold-climate applicability, local pump types and simple water-quality testing; the brief reviews do not establish adequacy.'
- 'Resilient shelter: assess the complete FEMA P-232 publisher download with an explicit larger transfer bound; add repair and weatherproofing coverage separately.'
- 'Power and heat: select practical finished references for small DC systems, batteries, basic generation, ventilation and stove maintenance; circuit theory alone does not close this gap.'
- 'Local topography: settle the geographic scope and review the previously frozen New England sheet candidates before admitting maps; a world street map does not substitute for contours or local completeness.'
topics:
- id: first-aid
  title: First aid and immediate emergencies
  status: partial
  atlas_topics: [health, first-aid, emergency-care]
  intended: A layperson can recognize danger, protect a scene, provide basic first response and arrange escalation; trained readers have a distinct emergency-care reference.
  resources: [owl-direct-core, civilian-preparedness, who-emergency-care, wikem]
  existing: CERT training, WHO Basic Emergency Care and job aids, FEMA preparedness and WikEM. Clinical material is not automatically suitable for an untrained reader.
  gaps: [A clearly separated layperson sequence, Current CPR and first-aid training materials with practical limits, A concise route from symptom or incident to the appropriate source]
  next: [Evaluate an official current layperson first-aid manual and illustrated skills reference; retain training requirements., Check the existing CERT and WHO contents against the layperson task list before adding duplicates.]
  done_when: A reviewed task matrix covers immediate common emergencies with an accessible first-response route and clear referral or training boundaries.
- id: clinical-care
  title: Clinical care, medicines and infection control
  status: partial
  atlas_topics: [clinical-medicine, medicines, infectious-disease, anatomy, nursing]
  intended: Trained health workers can find assessment, infection prevention, medicine references and escalation guidance; professional material remains clearly labelled.
  resources: [msf-medical, who-emergency-care, wikimed, wikem, openstax-core]
  existing: MSF clinical and essential-drug manuals and outbreak guides provide a foundation; WikiMed/WikEM broaden reference. College anatomy and nursing books are optional and do not count toward the default selection.
  gaps: [An edition and audience review across overlapping clinical manuals, Coverage of chronic care and rehabilitation in low-resource settings, Reviewed task routes and a currency policy for medicine information]
  next: [Audit the selected MSF editions and their contents before adding clinical sources., Identify a current finished primary-care or chronic-care reference from an authoritative publisher.]
  done_when: A qualified content review confirms the intended professional scope, current editions, practical limits and usable navigation for the agreed clinical task list.

schema_version: 1
reviewed_on: '2026-09-29'
profile: full-1tb
purpose: Practical household and community knowledge for prolonged loss of internet and limited electricity.
completion_rule: Adequate means the stated learning and practical tasks are supported by reviewed, usable resources with their prerequisites, illustrations, limits and offline access. Tags, file counts, downloads and GB totals establish neither depth nor adequacy.
maintenance_rule: Update the affected rows in the same change as each resource admission. Keep gaps and next selections explicit; only an editorial review with recorded evidence may mark a row adequate. Regenerate the documentation with scripts/build_content_docs.py.
next_batch:
- 'Initial literacy: all 366 selected Core Knowledge curriculum pages and 1,220 English PDFs are enumerated with a grade/component matrix. Review the 39 fully hashed kindergarten Skills PDFs alongside the six ancillary PDFs; complete dependencies and teaching-sequence review before admission.'
- 'Seed independence: review the fully hashed OSA 2010 seed-saving PDF against existing processing/quality modules. Keep the 2026 revision and regional crop-diagnosis gaps explicit; defer the enterprise/business volume.'
- 'Water systems: review the selected rainwater, Afridev and groundwater sequence against freezing, local pump types and testing. The two new Penn State download URLs returned HTML and are excluded; identify working finished alternatives.'
- 'Resilient shelter and storage: FEMA P-232 (2024) and UAF Root Cellars (2020 revision) are fully hashed candidates with rendered samples reviewed. Review task scope before admission; ordinary weatherproofing and repair remain gaps.'
- 'Power, textiles and radio: review the hashed DOE Energy Saver, NMSU Sewing Shortcuts and historical ARRL ARES candidates. Select separate small-DC, stove/ventilation, beginner hand-mending and current novice-radio references; these supplements do not close those tasks.'
- 'Local topography: 4,807 USGS PDFs and 1,051 Canadian ZIPs/PDFs passed bounded type/size checks, with complete ZIP-member accounting. Acquire and hash bodies, inspect readability and prove declared footprint coverage. Do not add the overlapping older New England subtotal.'
- 'Capacity: 7,095 source downloads add 712.149 GB; existing files and modeled support total 987.261 GB, leaving 2.739 GB below the 990 GB ceiling plus separate free-space/filesystem margins. Forty-six small PDFs are fully hashed; all large-body and offline-reader admission gates remain explicit. See docs/full-1tb-source-verification.md.'
- 'All preset expansions: exact source lists now fit 15.738 / 63.303 / 253.422 / 506.812 / 987.261 GB, including 1 GB total reader/setup budgets. Complete grade/subject and geographic cohorts are recorded in catalog/acquisition/preset-capacity-20260929.json. Acquire missing hashes and finish source/offline reviews before promotion; these are separate from the smaller admitted defaults.'
topics:
- id: first-aid
  title: First aid and immediate emergencies
  status: partial
  atlas_topics: [health, first-aid, emergency-care]
  intended: A layperson can recognize danger, protect a scene, provide basic first response and arrange escalation; trained readers have a distinct emergency-care reference.
  resources: [owl-direct-core, civilian-preparedness, who-emergency-care, wikem]
  existing: CERT training, WHO Basic Emergency Care and job aids, FEMA preparedness and WikEM. Clinical material is not automatically suitable for an untrained reader.
  gaps: [A clearly separated layperson sequence, Current CPR and first-aid training materials with practical limits, A concise route from symptom or incident to the appropriate source]
  next: [Evaluate an official current layperson first-aid manual and illustrated skills reference; retain training requirements., Check the existing CERT and WHO contents against the layperson task list before adding duplicates.]
  done_when: A reviewed task matrix covers immediate common emergencies with an accessible first-response route and clear referral or training boundaries.

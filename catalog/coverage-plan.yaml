  gaps: [An edition and audience review across overlapping clinical manuals, Coverage of chronic care and rehabilitation in low-resource settings, Reviewed task routes and a currency policy for medicine information]
  next: [Audit the selected MSF editions and their contents before adding clinical sources., Identify a current finished primary-care or chronic-care reference from an authoritative publisher., 'Review the planned MedlinePlus 2025-01 archive for patient education only; it is not admitted and does not replace a current clinical or medicine reference. See docs/full-1tb-capacity-spec.md.']
  done_when: A qualified content review confirms the intended professional scope, current editions, practical limits and usable navigation for the agreed clinical task list.

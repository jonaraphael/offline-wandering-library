- id: stackoverflow-durable
  reason: Full 114.856 GB archive is pinned only as an optional research input; it does not implement
    the requested durable-topic selection and is not proposed for default profiles.
- id: direct-reading-expansion
  reason: No new direct HTML export, question-level filter or Gutenberg book-ID deduplication has been
    implemented by these archive pins.
- id: survivor-tier-a
  reason: Official category ZIP links observed on Smithing, Machine Tools and Farming pages each returned
    HTTP 404 to HEAD on 2026-09-18. Category pages list individual PDFs but no linked checksums; no curated
    complete title list or bytes have been acquired in this bounded metadata-only check.

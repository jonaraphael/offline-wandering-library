- id: direct-reading-expansion-acquisition-v1
  resource_id: direct-reading-expansion
  adapter: zim_direct
  version: '1'
  source_asset_ids:
  - appropedia_en
  - cd3wd_en
  - ifixit_en
  - libretexts_bio
  - libretexts_chem
  - libretexts_eng
  - libretexts_geo
  - libretexts_math
  - libretexts_med
  - libretexts_phys
  - libretexts_stats
  - wikibooks_en
  - wikipedia_en
  output_asset_ids: []
  selection:
    language: en
    declared_include:
    - Additional directly readable copies of material from source resources already selected for this
      build
    - Prioritize Appropedia, CD3WD, iFixit, LibreTexts STEM and English Wikibooks
    - Broaden the article-list-driven high-priority English Wikipedia HTML lifeboat
    - Preserve diagrams, photographs, labels, captions, instructions, article context and book context
    - Retain licensing and attribution notices, source versions and ordinary local entry links
    - Treat the 60 GB target as additional storage beyond existing direct copies and their existing budgets
    - Limit derivative subjects to the selected source collections; excluding a source collection excludes
      its planned derivatives from this expansion
    - Full-1tb default preference for direct reading without a ZIM reader
    declared_exclude:
    - Expanding all of Wikipedia into millions of individual exFAT files
    - Counting existing directly readable source files or previously budgeted direct editions twice
    - Acquiring additional Khan, language or map collections to fill this budget
    - Exporting an excluded collection through this representation resource
    - Dropping illustrations or presenting decontextualized text as an equivalent illustrated guide
    - Implying that an ordinary-format derivative is redistributable without checking the source license
    entries: []
    no_padding: true
    review_required:
    - all critical procedure steps and figures
    - complete book/article context
    - local dependencies
    - source notices
    additional_only: true
  review:
    status: pending
    evidence: []
  blockers:
  - The tested in-place ZIM exporter and extra-catalog import are implemented. Reviewed article/book lists,
    collection-specific visual checks and complete verified output editions are still missing. The 60
    GB target is an additional representation allowance, not downloaded content.
  metadata_sources: []
- id: regional-maps-acquisition-v2
  resource_id: regional-maps
  adapter: usgs_maps
  version: '2'
  source_asset_ids: []
  output_asset_ids: []
  selection:
    language: en
    declared_include:
    - North America OSM archive; 21 GB planning component
    - Detailed local and regional GeoPDF/topographic maps; roughly 20–40 GB, with 30 GB in this default
      envelope
    - Home state or region
    - Neighboring states or regions
    - Likely evacuation corridors
    - Major watersheds
    - National and state forests
    - Major transport corridors
    - Compact profile may use a 10 GB regional selection instead of the full default envelope
    declared_exclude:
    - High-resolution topography for the entire continent by default
    - Treating physical-world/tectonic reference sheets as local road or evacuation maps
    - Automatically retaining North America OSM when the world replacement is selected
    states:
    - CT
    - MA
    - ME
    - NH
    - RI
    - VT
    overview: []
    overview_candidates:
    - id: usgs_usa_general_reference_112764_2001
      publisher_product_id: '112764'
      title: General Reference, National Atlas of the United States
      source_page: https://store.usgs.gov/product/112764
      source_url: https://store.usgs.gov/assets/yimages/PDF/112764.pdf
      scale: 5000000
      version_date: '2001-01-01'
      print_year: 2002
      size_bytes: 19527583
      sha256: null
      pin_status: pending
      candidate_manifest: catalog/acquisition/usa-overview-candidate.json
      candidate_manifest_sha256: ca0e33c39ef34df9023f43ea01b70a91f19e8a5f3ffa3cafa2dd027a7c929be2
      source_probe_evidence: catalog/acquisition/usa-overview-source-probe-evidence.json
      historical_warning: Historical 2001 edition printed in 2002. Population, administrative details,
        transportation and other time-sensitive features are not current. This national overview is not
        a local road, trail or evacuation-route map.
    selection_policy: Finest complete base scale that fits, latest edition per sheet; supplement exact
      base-scale gaps with finer sheets. No arbitrary truncation or byte-target filler.
    allowances:
      compact-256gb: 10000000000
      standard-512gb: 30000000000
    max_pages: 30
    historical_editions: 'Coarser publisher maps are explicitly historical: retain edition years and never
      claim current road or evacuation-route verification.'
    mixed_scale_gap_supplements: true
    coverage_scope: All six Census New England state boundaries; subtract only the explicitly identified
      zero-land Atlantic Ocean polygon. This does not exclude rivers, lakes, or any land.
    geometry_area_tolerance: 0
  review:
    status: pending
    evidence: []
  blockers:
  - USA overview USGS product 112764 is selected as a historical national reference; whole-file SHA256
    and PDF review remain pending.
  - All 75 selected topographic sources have exact HEAD byte sizes; whole-file SHA256 pins and build-time
    PDF review remain pending. No map body has been acquired.
  metadata_sources:
  - url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/0/query?where=STUSAB+IN+%28%27CT%27%2C%27MA%27%2C%27ME%27%2C%27NH%27%2C%27RI%27%2C%27VT%27%29&outFields=STUSAB&returnGeometry=true&outSR=4326&f=geojson
    kind: json
    role: boundaries

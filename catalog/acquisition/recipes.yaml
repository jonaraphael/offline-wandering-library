recipes:
- id: hesperian-health-acquisition-v1
  resource_id: hesperian-health
  adapter: hesperian
  version: '1'
  source_asset_ids: []
  output_asset_ids: []
  selection:
    language: en
    declared_include:
    - Publisher English chapter PDFs for Where There Is No Doctor (2025 printing), Where Women Have No
      Doctor (2024 printing), Where There Is No Dentist (2024), A Book for Midwives (2026 printing), A
      Community Guide to Environmental Health (2012), Disabled Village Children (2025 printing), Helping
      Children Who Are Blind (2000), Helping Health Workers Learn (2026 edition)
    - Preserve whole-book context through chapter titles, front matter, indexes and publisher supplementary
      pages; one back-matter file remains missing
    declared_exclude:
    - Unlicensed redistribution or adapted digital editions
    - Claiming these eight books comprise the entire Hesperian catalog
    - Claiming the missing midwives back matter was acquired
    edition: '2026'
    expected_filename: en_midw_2026_bm.pdf
  review:
    status: pending
    evidence: []
  blockers:
  - 270 of 271 official chapter PDFs are pinned. The missing 2026 back matter and discovered older
    whole-book URLs return HTTP 404. An official complete 2026 PDF purchase is identified, but its
    file, pin and complete same-edition review remain pending. Never mix chapters across editions.
  metadata_sources:
  - url: https://languages.hesperian.org/pages/en/pdf.html
    kind: html
- id: wikipedia-en-acquisition-v1
  resource_id: wikipedia-en
  adapter: zim_direct
  version: '1'
  source_asset_ids:
  - wikipedia_en
  output_asset_ids: []
  selection:
    language: en
    declared_include:
    - Whole pinned English maxi archive with images
    - Small article-list-driven HTML lifeboat under WIKIPEDIA/DIRECT/; aim for roughly 2–5 GB within this
      planning envelope
    - 'Lifeboat: human anatomy, common diseases, first-aid concepts and medicines'
    - 'Lifeboat: crops, food preservation, water treatment and sanitation'
    - 'Lifeboat: electricity, motors, generators, batteries, radios and mechanical systems'
    - 'Lifeboat: chemistry, materials, construction, navigation, meteorology and mathematics fundamentals'
    declared_exclude:
    - Expanding millions of articles into individual exFAT files
    - Replacing full maxi with nopic or mini without an explicit profile decision
    - Selecting lifeboat articles solely to fill a quota
    entries: []
    no_padding: true
    review_required:
    - all critical procedure steps and figures
    - complete book/article context
    - local dependencies
    - source notices
    additional_only: false
  review:
    status: pending
    evidence: []
  blockers:
  - The full English maxi archive is pinned. The in-place direct exporter is available; the curated lifeboat
    article list and visually verified HTML/image edition are still missing.
  metadata_sources: []

<div class="drive-picker">
  <button id="pick-drive" type="button" class="primary">Choose drive folder</button>
  <button id="confirm-drive-size" type="button" hidden>Use this drive size</button>
  <p id="drive-status" class="field-help" role="status">Choose the attached drive or an empty folder on it.</p>
  <p class="field-help">Use exFAT to share the drive across devices. Large archives are split for FAT32. Phones may have limited access to APFS or NTFS drives.</p>
</div>

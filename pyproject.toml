[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-wandering-library"
version = "0.1.0"
description = "Reproducible, directly readable offline emergency SSD libraries"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0.2,<7", "pypdf[crypto]>=6.10,<7"]

[project.optional-dependencies]
zim = ["libzim>=3.7,<4"]
acquisition = ["Shapely>=2,<3"]
pdf = ["PyMuPDF==1.28.2"]

[project.scripts]
owl-build = "owl.build:main"
owl-job = "owl.jobs:main"
owl-validate = "owl.catalog:main"
owl-verify = "owl.verify:main"
owl-copy = "owl.copy:main"
owl-discovery = "owl.discovery:main"
owl-atlas = "owl.atlas_build:main"
owl-import-sections = "owl.atlas_import:main"
owl-selector = "owl.selector:main"
owl-export-direct = "owl.export_direct:main"
owl-acquire = "owl.acquisition.cli:main"
owl-check-content = "owl.content_policy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owl = ["templates/*.html", "templates/*.js", "templates/*.cjs", "content_policy.json", "utility_policy.json", "topic_verticals.json"]

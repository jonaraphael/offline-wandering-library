name: Catalog source checks
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: catalog-source-checks
  cancel-in-progress: false
jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read source check history
        id: history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const title = 'Catalog source or browser route check failed';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'all', per_page: 100});
            const issue = issues.find(item => !item.pull_request && item.title === title && item.user?.login === 'github-actions[bot]');
            core.setOutput('issue-number', issue?.number ?? '');
            const history = issue?.body?.match(/^<!-- owl-inconclusive-weeks: (\{.*\}) -->$/m)?.[1] ?? '{}';
            fs.writeFileSync('link-check-history.json', history);
      - name: Probe pinned sources and live routes
        id: probe
        timeout-minutes: 21
        env:
          OWL_RELAY_BASE: ${{ vars.OWL_RELAY_BASE || 'https://owl-publisher-relay.snapandshop-jonaraphael.workers.dev' }}
          OWL_ARCHIVE_RELAY: ${{ vars.OWL_ARCHIVE_RELAY }}
        run: |
          archive=()
          if [[ "$OWL_ARCHIVE_RELAY" == true ]]; then archive+=(--archive-relay); fi
          python scripts/check_links.py --origin https://jonaraphael.com \
            --pages-base https://jonaraphael.com/offline-wandering-library/ \
            --relay-base "$OWL_RELAY_BASE" --workers 8 --route-sample 48 \
            --history link-check-history.json --output link-checks.json "${archive[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-link-checks
          path: link-checks.json
      - name: Update source check issue
        if: ${{ !cancelled() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.history.outputs.issue-number }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const artifact = 'link-checks.json';
            const title = 'Catalog source or browser route check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const green = process.env.PROBE_OUTCOME === 'success';
            const issue = Number(process.env.ISSUE_NUMBER);
            const body = [`Latest ${green ? 'passing' : 'failed'} run: ${run}`, `Checked commit: ${context.sha}`];
            let history = fs.readFileSync('link-check-history.json', 'utf8');
            let hasObservations = false;
            if (fs.existsSync(artifact)) {
              const {failed_assets, failed_routes, blocked_assets, blocked_routes, inconclusive_weeks, overdue_assets} =
                JSON.parse(fs.readFileSync(artifact, 'utf8'));
              const failures = [...failed_assets, ...failed_routes.map(row => `${row.route} / ${row.id}`)];
              const blocks = [...blocked_assets, ...blocked_routes.map(row => `${row.route} / ${row.id}`)];
              const pending = Object.entries(inconclusive_weeks);
              hasObservations = Boolean(blocks.length || pending.length);
              const section = (heading, items) => {
                if (items.length) body.push('', '## ' + heading, '', ...items.map(value => `- ${value}`));
              };
              section(`Failures (${failures.length})`, failures.slice(0, 30));
              section('Blocked for this checker', blocks);
              section(`Inconclusive publisher sources (${pending.length})`, pending.slice(0, 30).map(([id, row]) =>
                `${id} (${row.count} ${row.count === 1 ? 'week' : 'weeks'}${overdue_assets.includes(id) ? ', failing' : ''})`));
              body.push('', 'See the run’s `catalog-link-checks` artifact for HTTP statuses, sizes and response headers.');
              history = JSON.stringify(inconclusive_weeks);
            } else {
              body.push('', 'See the workflow log for the error that stopped the check.');
            }
            body.push('', `<!-- owl-inconclusive-weeks: ${history} -->`);
            const content = body.join('\n');
            if (issue || !green || hasObservations) {
              const number = issue || (await github.rest.issues.create({...context.repo, title, body: content})).data.number;
              await github.rest.issues.update({...context.repo, issue_number: number, body: content,
                ...(green ? {state: 'closed', state_reason: 'completed'} : {state: 'open', state_reason: 'reopened'})});
            }

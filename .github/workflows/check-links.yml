name: Catalog source checks
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/check_links.py --origin https://jonaraphael.github.io --output link-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-link-checks
          path: link-checks.json

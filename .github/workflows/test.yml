name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_catalog.py catalog/demo.yaml --allow-local
      - run: python scripts/build_selector.py --check
      - run: python scripts/build_drive.py "${{ runner.temp }}/owl-demo" --catalog catalog/demo.yaml --profile demo --allow-local --navigation-dir catalog/demo-navigation --strict-coverage
      - run: python scripts/build_atlas.py "${{ runner.temp }}/owl-demo" --catalog catalog/demo.yaml --allow-local --navigation-dir catalog/demo-navigation --strict-coverage
      - run: python scripts/verify.py "${{ runner.temp }}/owl-demo" --strict
      - run: python scripts/copy_drive.py "${{ runner.temp }}/owl-demo" "${{ runner.temp }}/owl-copy"
      - run: python scripts/verify.py "${{ runner.temp }}/owl-copy" --strict
  zim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[zim]'
      - run: python -m unittest discover -s tests -v

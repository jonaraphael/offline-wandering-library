name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  # The Python jobs run only from Actions → tests → Run workflow.
  test:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python scripts/check_content_policy.py
      - run: python scripts/check_selection_policy.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_catalog.py catalog/demo.yaml --allow-local
      - run: python scripts/build_capacity_ladder.py --check
      - run: python scripts/build_selector.py --check
      - run: python scripts/build_content_docs.py --check
      - run: python scripts/build_drive.py "${{ runner.temp }}/owl-demo" --catalog catalog/demo.yaml --profile demo --allow-local --navigation-dir catalog/demo-navigation --strict-coverage
      - run: python scripts/build_atlas.py "${{ runner.temp }}/owl-demo" --catalog catalog/demo.yaml --allow-local --navigation-dir catalog/demo-navigation --strict-coverage
      - run: python scripts/verify.py "${{ runner.temp }}/owl-demo" --strict
      - run: python -I "${{ runner.temp }}/owl-demo/LIBRARY/VERIFY.py" --strict
      - run: python scripts/copy_drive.py "${{ runner.temp }}/owl-demo" "${{ runner.temp }}/owl-copy"
      - run: python scripts/verify.py "${{ runner.temp }}/owl-copy" --strict
  zim:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[zim,pdf]'
      - run: python -m unittest discover -s tests -v
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python scripts/build_pages.py "${{ runner.temp }}/owl-pages" --search-commit "${{ github.sha }}"
      - run: node --test tests/archive-resume-route.test.mjs tests/browser-builder.test.mjs tests/capacity-probe.test.mjs tests/diagnostics.test.mjs tests/relay.test.mjs relay/worker.test.mjs tests/remove-tree.test.mjs tests/sync-reconcile.test.mjs tests/search/*.test.cjs
      - run: node tests/browser-plan.test.mjs "${{ runner.temp }}/owl-pages"
      - run: python scripts/search_benchmark.py --check
      - name: Test disk-full handling in headless Chrome
        run: |
          mkdir -p "${{ runner.temp }}/owl-browser"
          npm install --prefix "${{ runner.temp }}/owl-browser" playwright-core@1.58.0
          node scripts/check_browser_resume.cjs "${{ runner.temp }}/owl-browser" "$(command -v google-chrome)" "${{ runner.temp }}/owl-browser/node_modules/playwright-core" disk-full
      - name: Check emergency search in the offline reader
        env:
          NODE_PATH: ${{ runner.temp }}/owl-browser/node_modules
        run: |
          CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)" \
          python scripts/search_benchmark.py --assemble "${{ runner.temp }}/owl-search-reader" --check-reader
  publish:
    # Starts at once: a change reaches main through a pull request that passed the pages job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

name: Pages
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m pip install -e .
      - run: python scripts/build_selector.py --check
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/owl-mirrors
          key: owl-pages-mirrors-${{ hashFiles('web/pages-mirrors.json') }}
          restore-keys: owl-pages-mirrors-
      # OWL_RELAY_BASE is the required owner-approved publisher relay origin.
      - env:
          OWL_RELAY_BASE: ${{ vars.OWL_RELAY_BASE }}
          OWL_ARCHIVE_RELAY: ${{ vars.OWL_ARCHIVE_RELAY }}
        run: |
          if [[ -z "$OWL_RELAY_BASE" ]]; then
            echo "::error::Set the OWL_RELAY_BASE repository variable before publishing Pages."
            exit 1
          fi
          relay=(--relay-base "$OWL_RELAY_BASE")
          if [[ "$OWL_ARCHIVE_RELAY" == true ]]; then relay+=(--archive-relay); fi
          python scripts/build_pages.py "${{ runner.temp }}/owl-pages" --fetch-mirrors --cache "${{ runner.temp }}/owl-mirrors" --search-commit "${{ github.sha }}" "${relay[@]}"
      - run: node tests/browser-plan.test.mjs "${{ runner.temp }}/owl-pages"
      - run: python scripts/check_pages_profiles.py "${{ runner.temp }}/owl-pages"
      - name: Check production routes in headless Chrome
        run: |
          npm install --prefix "${{ runner.temp }}/owl-browser" playwright-core@1.58.0
          node scripts/check_csp_routes.cjs "${{ runner.temp }}/owl-pages" \
            "$(command -v google-chrome)" "${{ runner.temp }}/owl-browser/node_modules/playwright-core" \
            "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/owl-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

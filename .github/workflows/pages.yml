name: Pages
on:
  push:
    branches:
      - main
      - t3/council-offline-library-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python -m pip install -e .
      - run: python scripts/build_selector.py --check
      - run: python scripts/build_pages.py "${{ runner.temp }}/owl-pages" --fetch-mirrors --search-commit "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/owl-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
